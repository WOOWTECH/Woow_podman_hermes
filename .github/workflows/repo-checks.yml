# .github/workflows/repo-checks.yml: repo-specific static checks. quadlet-ci.yml is vendored from
# Woow_quadlet_migration_plan/lib and must not be edited; checks that belong to this repo live here.
name: repo-checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Credentials, compose removal (D1), READMEs, image pins
        run: tests/lint-repo.sh

      - name: Image patches and upstream contracts against the pinned upstream tag
        run: tests/patch-anchors.sh

      - name: shellcheck the in-image provisioning scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -s bash container/rootfs/usr/local/bin/woow-provision container/rootfs/etc/cont-init.d/020-woow-provision \
            container/rootfs/etc/cont-init.d/03-woow-dotenv container/rootfs/etc/cont-init.d/04-woow-paseo-origin

      - name: python syntax of the image patches
        run: python3 -m py_compile container/patches/*.py container/fix-model-routes.py container/vendor/paseo/*.py container/rootfs/opt/woow/paseo_origin.py

      - name: In-image provisioning behaviour (fix-model-routes exit codes)
        run: tests/provisioning-test.sh

      - name: Build, unit and provisioning contract (no image)
        run: python3 tests/test-config-contract.py

      - name: Paseo host adapter pins and packaging, origin validation (boot hook and install.sh agree)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 tests/test-paseo-vendor.py
          python3 tests/test-paseo-origin.py

      - name: A network or volume removed behind systemd's back is recreated (shims, no podman)
        run: tests/resource-recreate.sh

      # The image lanes (tests/image-test.sh, tests/run-scoped-prompt-gc-image.py) need the built
      # image and stay local; these two run the same patch against upstream excerpts.
      - name: Scoped prompt GC, patch contract and SQLite regressions on upstream excerpts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 tests/test-scoped-prompt-gc-patch.py
          python3 tests/test-scoped-prompt-gc.py
          if python3 tests/test-scoped-prompt-gc.py --unpatched >/dev/null; then
            echo "the negative control passed: the GC regressions no longer detect the unscoped delete"; exit 1
          fi

      - name: hadolint on the Containerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: container/Containerfile
          failure-threshold: error
